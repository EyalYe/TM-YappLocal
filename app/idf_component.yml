# Component manifest for the "Local" device app.
# taskmaster_core is provided locally by the firmware build (plain CMake REQUIRES).
# cJSON isn't bundled in IDF v6, so pull it from the component registry.
version: "0.1.0"
description: "TaskMaster-C3 'Local' task source app"
targets:
  - esp32c3
dependencies:
  espressif/cjson: "^1.7"
